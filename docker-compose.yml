services:
  # Local-only self-hosted NMT. Lets the full pipeline run end-to-end with no
  # external translation service. Swap for a real engine in production by
  # pointing EPUB_TRANSLATOR_NMT_ENDPOINT elsewhere.
  nmt:
    build:
      context: .
      dockerfile: Dockerfile.nmt
    image: epub-translator-nmt:local
    environment:
      - NMT_DEVSERVER_ADDR=:8081
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  # Real self-hosted NMT (LibreTranslate / Argos, EN→FR). Enable with the
  # "real-nmt" profile: `docker compose --profile real-nmt up`. First start
  # downloads the en→fr model. Point the app at it via NMT_PROVIDER=libretranslate.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["real-nmt"]
    environment:
      - LT_LOAD_ONLY=en,fr
    expose:
      - "5000"
    # Publish on the host so native (non-compose) runs can reach it too.
    # Host 5050 (5000 is often taken by macOS AirPlay Receiver).
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/languages"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Reference-free COMET-QE scoring service for quality evaluation. Heavy ML
  # stack, so it's behind the "eval" profile: `docker compose --profile eval up comet`.
  # First boot downloads the model (~2.3 GB) into the persisted comet-cache volume.
  # Point the app/host at it via EPUB_TRANSLATOR_COMET_ENDPOINT=http://localhost:8000/score
  # (or http://comet:8000/score from inside the compose network).
  comet:
    build:
      context: .
      dockerfile: Dockerfile.comet
    image: epub-translator-comet:local
    profiles: ["eval"]
    ports:
      - "8000:8000"
    volumes:
      - comet-cache:/cache/huggingface
    healthcheck:
      # /docs only responds once the model has finished loading at import time.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s

  # Local Temporal dev server: the durable execution engine for `run`/`batch`
  # (RFC 0009). `server start-dev` is a single-node server with an embedded
  # SQLite history, the `default` namespace auto-registered, and the Web UI
  # bundled in — no PostgreSQL, no Elasticsearch. Phase 2 ships the server only;
  # the worker that registers the workflows arrives in phase 3, so `app` does
  # not depend on it yet.
  #
  # Tag pinned to 1.8.3, the latest stable temporalio/temporal release
  # (Docker Hub temporalio/temporal, pushed 2026-09-02; temporalio/cli v1.8.3).
  temporal:
    image: temporalio/temporal:1.8.3
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
      - --ui-port
      - "8233"
    ports:
      # gRPC frontend for workers and the CLI, and the Web UI.
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      # The CLI ships in the same image; ask the frontend whether the cluster
      # is serving on the gRPC port.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: epub-translator:local
    env_file:
      - .env.local
    environment:
      # Override the endpoint to the in-network dev NMT so `just up` is
      # self-contained regardless of .env.local. For real translations, switch
      # to the libretranslate service (see README) by setting:
      #   EPUB_TRANSLATOR_NMT_PROVIDER=libretranslate
      #   EPUB_TRANSLATOR_NMT_ENDPOINT=http://libretranslate:5000/translate
      - EPUB_TRANSLATOR_NMT_ENDPOINT=http://nmt:8081/translate
      # Secrets are not in .env.local anymore, and env_file is read from disk by
      # Compose — so a `op run -- docker compose up` would inject nothing
      # without these. Interpolation resolves them from Compose's own
      # environment, which is exactly what `op run` provides. They default to
      # empty so a run with no secrets (dev NMT, no LLM) still starts.
      - EPUB_TRANSLATOR_LLM_API_KEY=${EPUB_TRANSLATOR_LLM_API_KEY:-}
      - EPUB_TRANSLATOR_NMT_API_KEY=${EPUB_TRANSLATOR_NMT_API_KEY:-}
    depends_on:
      nmt:
        condition: service_healthy
    volumes:
      - ./runs:/app/runs
      - ./books:/app/books
      - ./data:/app/data
    command: ["run", "--input", "/app/books/source.epub", "--output-dir", "/app/runs", "--source-lang", "en", "--target-lang", "fr"]

volumes:
  comet-cache:
  temporal-data:
