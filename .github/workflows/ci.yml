name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Fuzz smoke (placeholder round-trip, CLI flags)
        run: |
          go test ./internal/segment -run '^$' -fuzz '^FuzzTokenizeRestore$' -fuzztime 15s
          go test ./internal/cli -run '^$' -fuzz '^FuzzParseRunArgs_NoPanic$' -fuzztime 15s
